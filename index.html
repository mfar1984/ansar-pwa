<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` plus the `env(safe-area-inset-*)` padding in base.css is what keeps the
      bottom tab bar clear of the iPhone home indicator. `maximum-scale` is deliberately NOT set:
      pinning zoom on a staff tool takes accessibility away from the people who need it most.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <!--
      Keep this IDENTICAL to `description` in the manifest block of `vite.config.ts`. Two
      descriptions of one app is two places for a rename to be half-finished, and the Phase 3 tab
      rename reached this line too — README.md records which words changed and why.

      AND NOTE: an HTML comment is NOT stripped by the build. Vite minifies the JS and the CSS and
      drops their comments, but `index.html` is emitted with its comments intact and served as
      written. An earlier draft of this one quoted the OLD tab name to explain the change, and the
      release grep for that name found it here — 1 occurrence, in the shipped file, after every
      source occurrence had been removed. Explanations that name something the product no longer
      says belong in README.md, not in markup the browser downloads.
    -->
    <meta name="description" content="Work orders and HR for Ansar Technologies staff." />
    <!-- Both on purpose: the standard tag is what Chrome asks for, the Apple one is what older iOS reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ansar" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>Ansar Staff</title>
    <script type="module" crossorigin src="/assets/index-BpNavvJ7.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style-BFG6sY7N.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <!--
      `vite-plugin-pwa` injects the manifest link and the service-worker registration script here
      at build time (`injectRegister: 'auto'`). They are deliberately not hand-written: two
      declarations of one manifest is how a renamed file stops being served.
    -->
    <div id="root"></div>
  </body>
</html>
